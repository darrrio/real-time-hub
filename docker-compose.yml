services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"
    depends_on:
      - redpanda

  redpanda-connect:
    image: docker.redpanda.com/redpandadata/connect
    volumes:
      - ./connect:/connect
    command: run /connect/pipeline.yaml
    env_file: .env
    depends_on:
      - llm-annotator
      - redpanda

  llm-annotator:
    build: ./llm-annotator
    ports:
      - "8000:8000"

  generator:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./generators:/app/generators
    env_file: .env
    command: sh -c "pip install -r generators/requirements.txt && python -m generators.main"

  dashboard:
    build: ./dashboard
    ports:
      - "8080:8080"
    env_file: .env

volumes:
  redpanda-data:
