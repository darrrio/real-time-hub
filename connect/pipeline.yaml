cache_resources:
  - label: zone_state
    memory:
      default_ttl: 1h

input:
  redpanda:
    seed_brokers: [ "${REDPANDA_BOOTSTRAP_SERVERS}" ]
    regexp_topics_include:
      - "^sensors\\..*"
      - "^weather\\.forecast$"
      - "^comfort\\.setpoints$"
      - "^schedule\\.hours$"
    consumer_group: "hvac-comfort-pipeline"

pipeline:
  processors:
    - mapping: |
        meta domain = @kafka_topic
        meta zone_id = this.zone_id.or(this.unit_id).or("unknown")
        meta timestamp = this.timestamp
        root = this

    # Cache the latest setpoint per zone; every message passes through untouched.
    - branch:
        request_map: |
          root = if meta("domain") == "comfort.setpoints" { this } else { deleted() }
        processors:
          - cache:
              resource: zone_state
              operator: set
              key: "${! meta(\"zone_id\") } setpoint"
              value: "${! this.setpoint_c.string() }"
        result_map: "root = deleted()"

    # Deterministic comfort decision for indoor temperature readings.
    - branch:
        request_map: |
          root = if meta("domain") == "sensors.indoor_temperature" { this } else { deleted() }
        processors:
          - cache:
              resource: zone_state
              operator: get
              key: "${! meta(\"zone_id\") } setpoint"
          - catch:
              - mapping: 'root = "21.0"'
          - mapping: |
              root.setpoint_c = content().string().number()
        result_map: |
          root.zone_id = meta("zone_id")
          root.timestamp = meta("timestamp")
          root.setpoint_c = this.setpoint_c
          root.comfort_delta = ((this.setpoint_c - root.temperature_c) * 100).round() / 100
          # Deadband: +/-1C avoids overheating (over-eager heating) and
          # underperformance (chattering / never settling) around the setpoint.
          root.action = if root.comfort_delta > 1.0 {
              "heat"
            } else if root.comfort_delta < -1.0 {
              "cool"
            } else {
              "hold"
            }

    - mapping: |
        root = if this.action == null { deleted() } else { this }

output:
  broker:
    pattern: fan_out
    outputs:
      - redpanda:
          seed_brokers: [ "${REDPANDA_BOOTSTRAP_SERVERS}" ]
          topic: "comfort.actions"

      - processors:
          - mapping: 'root = if this.action == "hold" { deleted() } else { this }'
          - branch:
              request_map: |
                root.zone_id = this.zone_id
                root.temperature_c = this.temperature_c
                root.setpoint_c = this.setpoint_c
                root.comfort_delta = this.comfort_delta
                root.action = this.action
              processors:
                - http:
                    url: "http://llm-annotator:8000/annotate"
                    verb: POST
                    headers:
                      Content-Type: application/json
                    timeout: 15s
                    retries: 0
                - catch:
                    - mapping: 'root.suggestion = "annotator unavailable"'
              result_map: |
                root.suggestion = this.suggestion.or("annotator unavailable")
        redpanda:
          seed_brokers: [ "${REDPANDA_BOOTSTRAP_SERVERS}" ]
          topic: "comfort.suggestions"
